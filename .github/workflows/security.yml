name: Security

# Both scans live in landsman/config and are called, not copied, so a new
# scanner version or an extra default pack reaches this repo on its next run.
on:
  workflow_dispatch:
  pull_request:
  # A lockfile nobody touches still collects new advisories; only a run on an
  # unchanged commit sees them.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # p/java is the only language pack: the one .kts file is build config, and
  # p/gradle does not exist in the registry. p/secrets and p/ci come from the baseline.
  semgrep:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/java

  # Reads gradle.lockfile; `make lock` rewrites it.
  dependencies:
    uses: landsman/config/.github/workflows/dependencies.yml@main
