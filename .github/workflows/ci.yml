name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels that PR's run still going: only the newest commit's result counts.
# A push to main or a scheduled scan is never cancelled, so every merged commit and every Monday get a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The oldest JDK the library supports, so a newer one's API cannot slip in; mise.toml builds on 25 locally.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: make build
