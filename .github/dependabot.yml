version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    # The compat projects pin the Spring Boot versions they prove the library on; a bump would stop testing them.
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
