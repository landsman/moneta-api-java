version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    # The compatibility tests and the integrations pin the Spring Boot, Play, Micronaut and Quarkus versions they prove or
    # build against; a bump would stop testing them.
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-dependencies
      # The same for Play, in the module and testing/play.
      - dependency-name: org.playframework:*
      - dependency-name: com.typesafe.play:*
      - dependency-name: io.micronaut.platform:micronaut-platform
      - dependency-name: io.quarkus:*
      - dependency-name: io.quarkus.platform:*
      - dependency-name: io.quarkus.extension:*
      # Named only in the Jackson floor in build.gradle.kts, never as a dependency. jackson-databind cannot be
      # ignored the same way, since the library does depend on it; the floor is written so Dependabot skips it.
      - dependency-name: tools.jackson.core:jackson-core
      - dependency-name: com.fasterxml.jackson.core:jackson-annotations
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
